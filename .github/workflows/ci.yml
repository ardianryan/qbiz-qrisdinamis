name: Security Audit & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Security & Build Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run npm Security Audit (High & Critical Filter)
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high

      - name: Verify Tailwind CSS Build Integrity
        run: deno task build:css

  test:
    name: Run Deno Test Suite
    runs-on: ubuntu-latest
    needs: security-audit

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qrispaymti
          POSTGRES_USER: qbiz_user
          POSTGRES_PASSWORD: qbiz_secure_password_ci_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Drizzle Database Migrations
        env:
          DATABASE_URL: postgres://qbiz_user:qbiz_secure_password_ci_2026@localhost:5432/qrispaymti
        run: deno task db:migrate

      - name: Run Deno Unit & Integration Tests
        env:
          DATABASE_URL: postgres://qbiz_user:qbiz_secure_password_ci_2026@localhost:5432/qrispaymti
          COOKIE_SECRET: a1b2c3d4e5f67890123456789abcdef0
          JWT_SECRET: f0e1d2c3b4a567890123456789abcdef
        run: deno task test
