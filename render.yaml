services:
  - type: web
    name: qbiz-gateway
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qbiz-postgres
          property: connectionString

databases:
  - name: qbiz-postgres
    plan: starter
    region: singapore
    databaseName: qrispaymti
    user: qbiz_user
