version: '3.8'

services:
  web:
    image: ardianryan/qbiz-qrisdinamis:latest
    build: .
    container_name: qbiz-qris-app
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-qbiz_user}:${DB_PASSWORD:?Error: DB_PASSWORD must be configured in .env}@db:5432/${DB_NAME:-qrispaymti}
      - COOKIE_SECRET=${COOKIE_SECRET:?Error: COOKIE_SECRET must be configured in .env}
      - JWT_SECRET=${JWT_SECRET:?Error: JWT_SECRET must be configured in .env}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sessions:/app/sessions
      - ./static/uploads:/app/static/uploads

  db:
    image: postgres:15-alpine
    container_name: qbiz-qris-db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-qrispaymti}
      - POSTGRES_USER=${DB_USER:-qbiz_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Error: DB_PASSWORD must be configured in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qbiz_user} -d ${DB_NAME:-qrispaymti}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
